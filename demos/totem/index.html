<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual - EEST N°5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            cursor: pointer; /* Indica sutilmente que se puede hacer clic en cualquier lugar */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }
        /* Indicador sutil de conexión (se oculta al conectar) */
        #statusOverlay {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <canvas id="faceCanvas"></canvas>
    <div id="statusOverlay">Demo sin Arduino: hacé clic para escuchar y ver la cara</div>

    <script src="script.js"></script>
</body>
</html>
